<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ماسح الباركود المباشر</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f9;
      margin: 0;
      padding: 15px;
    }
    #reader {
      width: 100%;
      max-width: 400px;
      margin: 15px auto;
      border: 2px solid #333;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    #result-box {
      margin: 20px auto;
      max-width: 400px;
      padding: 20px;
      font-size: 26px;
      font-weight: bold;
      border-radius: 10px;
      display: none;
    }
    .found { background-color: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
    .not-found { background-color: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
    .loading { background-color: #fff3cd; color: #856404; border: 2px solid #ffeeba; }
  </style>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

  <h2>مراجعة الطلاب على كشف التنسيق</h2>
  <div id="reader"></div>
  <div id="result-box"></div>

  <script>
    // ضع رابط تطبيق جوجل سكريبت الخاص بك هنا
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygD2KhV_zKIzOCE77MjcQE6XzD5JeA90L2rlOZH941hJjQ7kFR6vdfi1PUF4mETz5gAA/exec";

    let isProcessing = false;

    function playBeep(type) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (type === 'found') {
          let osc = audioCtx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, audioCtx.currentTime);
          osc.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.2);
        } else {
          let now = audioCtx.currentTime;
          let osc1 = audioCtx.createOscillator();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(440, now);
          osc1.connect(audioCtx.destination);
          osc1.start(now);
          osc1.stop(now + 0.15);
          
          let osc2 = audioCtx.createOscillator();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(440, now + 0.25);
          osc2.connect(audioCtx.destination);
          osc2.start(now + 0.25);
          osc2.stop(now + 0.4);
        }
      } catch (e) {}
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      const resultBox = document.getElementById('result-box');
      resultBox.style.display = 'block';
      resultBox.className = 'loading';
      resultBox.innerText = 'جاري البحث...';

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ code: decodedText })
      })
      .then(res => res.json())
      .then(response => {
        if (response.status === "found") {
          resultBox.className = 'found';
          resultBox.innerText = 'مرشح';
          playBeep('found');
        } else {
          resultBox.className = 'not-found';
          resultBox.innerText = 'غير مرشح';
          playBeep('not_found');
        }
        setTimeout(() => { isProcessing = false; }, 2500);
      })
      .catch(err => {
        resultBox.className = 'not-found';
        resultBox.innerText = 'خطأ في الاتصال!';
        setTimeout(() => { isProcessing = false; }, 2500);
      });
    }

    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", 
      { fps: 10, qrbox: { width: 250, height: 250 } },
      false
    );
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
